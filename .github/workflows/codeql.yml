# CodeQL through the shared workflow in wow-two-platform.pipelines: weekly and on main pushes that change more than
# markdown, beside delivery, never inside it. Findings land in the Security tab.
name: codeql

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'product/**', 'engineering/planning/**']
  schedule:
    - cron: '41 2 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    uses: wow-two-platform/wow-two-platform.pipelines/.github/workflows/codeql.yml@e7d8d62111b300a1cbba5a1d69da30cc537b0bc6
    with:
      languages: '["csharp", "javascript-typescript", "actions"]'
