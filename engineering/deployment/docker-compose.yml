# Local verification only. Bring up from engineering/deployment/:
#
#   docker compose up -d --build     the whole stack; the app answers on http://127.0.0.1:8371
#   docker compose up -d database    only the database, for an IDE run of WheelhouseCanary.Api (loopback 8374)
#
# The credentials are local-only; a deployed environment's connection string lives in its Wheelhouse target settings.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wheelhouse_canary
      POSTGRES_USER: canary
      POSTGRES_PASSWORD: canary
    ports:
      - "127.0.0.1:8374:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canary -d wheelhouse_canary"]
      interval: 5s
      timeout: 3s
      retries: 20
  canary:
    image: wheelhouse-canary:local
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    ports:
      - "127.0.0.1:8371:8080"
    environment:
      DB_CONNECTION: "Host=database;Database=wheelhouse_canary;Username=canary;Password=canary"
      Canary__Label: compose
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 256m
volumes:
  database:
