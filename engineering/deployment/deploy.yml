# yaml-language-server: $schema=../../../../../conventions/deployment/descriptor/deploy.schema.json
# What this product deploys: its sites, its services, how each builds, what changes it and which paths it serves.
# Format and rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md. Hostnames, secrets and
# environments live in Wheelhouse targets, never here. Paths are relative to engineering/.
#
# WheelhouseCanary is the sample app Wheelhouse deploys to its own dev and prod environments to prove every
# deployment flow before a Wheelhouse release is promoted.
descriptor: 2
product: wheelhousecanary
# What Wheelhouse and every other reader call it (pipelines v0.11.0); it replaced product/product.json.
name: Wheelhouse Canary
description: The sample app Wheelhouse deploys to dev and prod to prove every deployment flow before a release.
homepage: https://github.com/wow-two-platform/wow-two-platform.wheelhouse-canary
platform: linux/amd64
# Dev runs as .NET Development, prod as Production; the IDE run's database lives in appsettings.Local.json.
dotnetEnvironment: true
# The sample dev check: once a dev rollout succeeds, the canary's own image asks the service for its health and its
# pings over the platform network. A pass lets auto-promote take the release. Each request carries the probe Host
# (localhost): a target's AllowedHosts names its public host plus localhost, so the service's platform-network name
# in the URL would answer 400 from host filtering.
verify:
  service: canary
  command:
    - sh
    - -c
    - >-
      curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_CANARY/health"
      && curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_CANARY/api/pings"
      && echo "health and pings answered"
  timeout: 1m
# One private site; Wheelhouse binds it to the environment's tailnet host (pipelines v0.8.0, descriptor 2).
sites:
  app: { primary: true, exposure: private }
shared:
  - codebase/wheelhouse-canary.backend-services/Directory.*.props
  - codebase/wheelhouse-canary.backend-services/global.json
services:
  canary:
    build:
      dockerfile: deployment/Dockerfile
    paths:
      - codebase/wheelhouse-canary.backend-services/**
      - codebase/wheelhouse-canary.frontend-services/**
    health: /health
    memory: 256m
    settings:
      required:
        - DatabaseSettings:ConnectionString
        - Canary:Label
    needs: [postgres]
    # The bundle services canary starts after, once each is healthy: none, since its one dependency, PostgreSQL, is a
    # platform service under needs. A second service here would list canary to start after it, and canary's updates
    # would never restart it (pipelines v0.6.0).
    dependsOn: []
    # The Vue app at /, and the API under the same host's /api: /api routes ahead of /, never /apiary.
    sites:
      app: { paths: [/, /api] }
